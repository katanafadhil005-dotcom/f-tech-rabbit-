<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>F Tech Rabbit — Farm Fresh & Farm Smart</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- HEADER -->
  <header>
    <h1>🐇 F Tech Rabbit</h1>
    <p id="tagline">Loading…</p>
    <button id="cart-btn">🛒 Cart (<span id="cart-count">0</span>)</button>
  </header>

  <!-- PRODUCTS -->
  <main>
    <h2>Our Products</h2>
    <div id="product-list" class="grid"></div>
  </main>

  <!-- CART SIDEBAR -->
  <aside id="cart-panel" class="hidden">
    <h2>Your Cart</h2>
    <ul id="cart-items"></ul>
    <p><strong>Total: KES <span id="cart-total">0</span></strong></p>

    <h3>Checkout</h3>
    <input id="customer-name" type="text" placeholder="Your name" required>
    <input id="customer-phone" type="tel" placeholder="Phone number" required>
    <button id="checkout-btn">Place Order</button>
    <p id="order-status"></p>
  </aside>

  <script src="app.js"></script>
</body>
</html>
